<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081b3a">
<title>ASTYLES ONE Rentals</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#12213a}
header{height:64px;background:#081b3a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:900;letter-spacing:1.2px;font-size:19px}
.topbtn{border:1px solid #e9bd3c;background:transparent;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}
main{max-width:900px;margin:auto;padding:18px 15px 92px}
.screen{display:none}.screen.active{display:block}
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.eyebrow{color:#b88708;font-weight:900;letter-spacing:2px;font-size:12px}
.hero h1{font-size:clamp(38px,10vw,62px);line-height:1.02;margin:12px 0}
.hero p{color:#60708a;font-size:17px;max-width:520px}
.actions{width:min(420px,100%);display:grid;gap:12px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.primary{background:#0b2a5b;color:#fff}.gold{background:#e9bd3c;color:#13213a}
.whatsapp{background:#168c4a;color:#fff}.call{background:#e8eef7;color:#0b2a5b}
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.head h2{font-size:30px;margin:3px 0}.back{border:0;background:transparent;color:#0b2a5b;font-weight:900}
.filters{display:grid;grid-template-columns:1fr 170px;gap:9px;margin-bottom:15px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d4dce8;border-radius:11px;background:#fff;font:inherit}
textarea{min-height:105px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:15px;box-shadow:0 5px 18px rgba(16,33,59,.07)}
.property{padding:0;overflow:hidden}.property img{width:100%;height:175px;object-fit:cover;display:block}
.property .body{padding:15px}.price{font-size:20px;font-weight:900;color:#0b2a5b}
.meta{font-size:14px;color:#66758a;margin:7px 0 13px}
form{display:grid;gap:11px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.message{font-weight:800;color:#0b2a5b}
.preview{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:7px;display:none}
.detail-img{width:100%;max-height:360px;object-fit:cover;border-radius:16px}
.ownerbox,.card-owner{background:#f5f8fc;border:1px solid #dce5f0;border-radius:12px;padding:13px;margin:14px 0}
.ownerbox strong,.card-owner strong{display:block;font-size:16px;margin-bottom:5px}
.ownerbox div,.card-owner div{margin:3px 0}.card-owner{margin:11px 0;padding:11px}
.card-owner div{font-size:14px}
.contact-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.empty{padding:25px;text-align:center}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dce3ec;display:flex;justify-content:center;gap:4px;padding:8px 6px;z-index:20}
.bottom button{border:0;background:transparent;color:#0b2a5b;font-weight:900;padding:9px 10px}
@media(max-width:600px){.filters{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}.bottom button{font-size:12px}}

.authbox{max-width:520px;margin:20px auto}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.auth-tabs button{border:1px solid #d4dce8;background:#fff;border-radius:10px;padding:12px;font-weight:900}
.auth-tabs button.active{background:#0b2a5b;color:#fff}
.owner-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#f5f8fc;border:1px solid #dce5f0;border-radius:12px;padding:14px}
.stat strong{display:block;font-size:22px;color:#0b2a5b}
@media(max-width:600px){.owner-summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">ASTYLES ONE</div>
  <button class="topbtn" onclick="openOwnerArea()">List a House</button>
</header>

<main>
<section id="welcome" class="screen active">
  <div class="hero">
    <div class="eyebrow">RENTALS</div>
    <h1>Find Your Next Home</h1>
    <p>One simple platform connecting house owners with tenants.</p>
    <div class="actions">
      <button class="btn primary" onclick="show('tenant')">I'm a Tenant</button>
      <button class="btn gold" onclick="openOwnerArea()">I'm a House Owner</button>
    </div>
  </div>
</section>

<section id="tenant" class="screen">
  <div class="head">
    <div><div class="eyebrow">TENANT</div><h2>Find a home</h2></div>
    <button class="back" onclick="show('welcome')">Back</button>
  </div>
  <div class="filters">
    <input id="q" placeholder="Search location or property..." oninput="render()">
    <select id="max" onchange="render()">
      <option value="">Any rent</option>
      <option value="1000000">Up to UGX 1M</option>
      <option value="1500000">Up to UGX 1.5M</option>
      <option value="2000000">Up to UGX 2M</option>
    </select>
  </div>
  <div id="list" class="grid"></div>
</section>

<section id="details" class="screen">
  <button class="back" onclick="show('tenant')">Back to homes</button>
  <div id="detail" style="margin-top:12px"></div>
</section>


<section id="interest" class="screen">
  <div class="head">
    <div><div class="eyebrow">INQUIRY</div><h2>I’m Interested</h2></div>
    <button class="back" onclick="show('tenant')">Back</button>
  </div>
  <div id="interestProperty" class="card" style="margin-bottom:12px"></div>
  <div class="card">
    <form id="interestForm">
      <div class="field"><label>Your full name</label><input id="tenantName" required placeholder="e.g. John Doe"></div>
      <div class="field"><label>Your contact number</label><input id="tenantPhone" type="tel" required placeholder="+256 700 000 000"></div>
      <div class="field"><label>Message</label><textarea id="tenantMessage" placeholder="I would like to view this property..."></textarea></div>
      <button class="btn primary" type="submit">Send Inquiry</button>
      <div id="interestMsg" class="message"></div>
    </form>
  </div>
</section>

<section id="auth" class="screen">
  <div class="head">
    <div><div class="eyebrow">OWNER ACCOUNT</div><h2>Owner Login</h2></div>
    <button class="back" onclick="show('welcome')">Back</button>
  </div>
  <div class="card authbox">
    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button" onclick="setAuthMode('login')">Login</button>
      <button id="signupTab" type="button" onclick="setAuthMode('signup')">Create Account</button>
    </div>
    <form id="authForm">
      <div class="field"><label>Email</label><input id="authEmail" type="email" required placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" required minlength="6" placeholder="At least 6 characters"></div>
      <div id="authNameField" class="field" style="display:none"><label>Full name</label><input id="authName" placeholder="Your full name"></div>
      <button id="authSubmit" class="btn primary" type="submit">Login</button>
      <div id="authMsg" class="message"></div>
    </form>
  </div>
</section>

<section id="dashboard" class="screen">
  <div class="head">
    <div><div class="eyebrow">OWNER PAGE</div><h2 id="dashTitle">My Properties</h2></div>
    <button class="back" onclick="logoutOwner()">Logout</button>
  </div>
  <div class="owner-summary">
    <div class="stat"><span>Properties</span><strong id="propertyCount">0</strong></div>
    <div class="stat"><span>Enquiries</span><strong id="inquiryCount">0</strong></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <button class="btn gold" style="width:100%" onclick="openOwnerArea()">+ List a Property</button>
  </div>
  <div id="ownerProperties" class="grid"></div>
  <div class="card" style="margin-top:14px">
    <div class="eyebrow">TENANT ENQUIRIES</div>
    <h3>My enquiries</h3>
    <div id="ownerInquiries"></div>
  </div>
</section>

<section id="owner" class="screen">
  <div class="head">
    <div><div class="eyebrow">HOUSE OWNER</div><h2>List your property</h2></div>
    <button class="back" onclick="show('welcome')">Back</button>
  </div>
  <div class="card">
    <form id="form">
      <div class="field">
        <label>Owner full name</label>
        <input name="ownerName" required placeholder="e.g. John Doe">
      </div>
      <div class="two">
        <div class="field">
          <label>Phone number</label>
          <input name="phone" type="tel" required placeholder="+256 700 000 000">
        </div>
        <div class="field">
          <label>WhatsApp number</label>
          <input name="whatsapp" type="tel" placeholder="+256 700 000 000">
        </div>
      </div>
      <div class="field">
        <label>Property title</label>
        <input name="title" required placeholder="e.g. 2 Bedroom House">
      </div>
      <div class="field">
        <label>Location</label>
        <input name="location" required placeholder="e.g. Ntinda, Kampala">
      </div>
      <div class="field">
        <label>Monthly rent (UGX)</label>
        <input name="rent" type="number" required placeholder="1200000">
      </div>
      <div class="two">
        <div class="field"><label>Bedrooms</label><input name="beds" type="number" min="1" required value="2"></div>
        <div class="field"><label>Bathrooms</label><input name="baths" type="number" min="1" required value="1"></div>
      </div>
      <div class="field">
        <label>Property photo</label>
        <input id="photo" name="photo" type="file" accept="image/*">
        <img id="preview" class="preview" alt="Photo preview">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea name="description" required placeholder="Tell tenants about the property..."></textarea>
      </div>
      <button class="btn primary" type="submit">Publish Property</button>
      <div id="msg" class="message"></div>
    </form>
  </div>
</section>
</main>

<nav class="bottom">
  <button onclick="show('welcome')">Home</button>
  <button onclick="show('tenant')">Find Homes</button>
  <button onclick="openOwnerArea()">List House</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ubcgltbyqohhgotwjhoy.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViY2dsdGJ5cW9oaGdvdHdqaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTU3MTcsImV4cCI6MjEwMjA3MTcxN30.MDtiNU5eSjbal31fdZwIqTPlwZlZEJzxFMDuArEuN_c";
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const STORAGE_BUCKET="property-images";
const fallback="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=900&q=80";

async function uploadPropertyPhoto(file){
  if(!file)return fallback;
  if(!file.type.startsWith("image/"))throw new Error("Please select an image file.");
  if(file.size>10*1024*1024)throw new Error("Photo is too large. Please use an image under 10 MB.");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`properties/${Date.now()}-${crypto.randomUUID()}.${ext||"jpg"}`;
  const {error}=await db.storage.from(STORAGE_BUCKET).upload(path,file,{
    cacheControl:"3600",upsert:false,contentType:file.type
  });
  if(error)throw error;
  return db.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

const seed=[
  {
    id:1,ownerName:"A Styles One",title:"Modern 2 Bedroom House",
    location:"Ntinda, Kampala",rent:1200000,beds:2,baths:2,
    photo:fallback,description:"Comfortable modern home in a convenient location.",
    phone:"+256 700 000 000",whatsapp:"+256 700 000 000"
  },
  {
    id:2,ownerName:"A Styles One",title:"Family Home",
    location:"Kira, Wakiso",rent:1500000,beds:3,baths:2,
    photo:"https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=900&q=80",
    description:"Spacious family home with easy access to shops and transport.",
    phone:"+256 700 000 001",whatsapp:"+256 700 000 001"
  }
];

let homes;
try{homes=JSON.parse(localStorage.getItem("astylesRentals003"))||seed}catch(e){homes=seed}

const money=n=>"UGX "+Number(n).toLocaleString("en-UG");

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="tenant")render();
  scrollTo(0,0);
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function phoneValue(v){
  return String(v||"").replace(/[^\d+]/g,"");
}

function whatsappValue(v){
  return String(v||"").replace(/[^\d+]/g,"").replace(/^\+/,"");
}

/* Property cards now show owner name, phone and WhatsApp directly. */
function render(){
  const q=(document.getElementById("q")?.value||"").toLowerCase();
  const max=Number(document.getElementById("max")?.value||0);

  const a=homes.filter(x=>
    (!q||String(x.location).toLowerCase().includes(q)||String(x.title).toLowerCase().includes(q)) &&
    (!max||Number(x.rent)<=max)
  );

  document.getElementById("list").innerHTML=a.length
    ? a.map(x=>{
        const phone=phoneValue(x.phone);
        const wa=whatsappValue(x.whatsapp||x.phone);
        return `
        <article class="card property">
          <img src="${x.photo||fallback}" alt="${esc(x.title)}">
          <div class="body">
            <div class="price">${money(x.rent)}/month</div>
            <h3>${esc(x.title)}</h3>
            <div class="meta">${esc(x.location)} · ${x.beds} bedrooms · ${x.baths} bathrooms</div>

            <button class="btn gold" style="width:100%;margin-top:9px" onclick="openInterest(${x.id})">I’m Interested</button><button class="btn primary" style="width:100%;margin-top:9px" onclick="details(${x.id})">
              View Property
            </button>
          </div>
        </article>`;
      }).join("")
    : `<div class="card empty"><h3>No homes found</h3><p>Try another location or rent range.</p></div>`;
}

/* Full details page also shows the same owner information. */
function details(id){
  const x=homes.find(v=>v.id===id);
  if(!x)return;

  const phone=phoneValue(x.phone);
  const wa=whatsappValue(x.whatsapp||x.phone);

  document.getElementById("detail").innerHTML=`
    <img class="detail-img" src="${x.photo||fallback}" alt="${esc(x.title)}">
    <div class="card" style="margin-top:12px">
      <div class="eyebrow">AVAILABLE HOME</div>
      <h2>${esc(x.title)}</h2>
      <div class="price">${money(x.rent)}/month</div>
      <div class="meta">${esc(x.location)} · ${x.beds} bedrooms · ${x.baths} bathrooms</div>
      <p>${esc(x.description)}</p>

      <div class="ownerbox">
        <strong>Contact Owner</strong>
        <div>👤 ${esc(x.ownerName||"Property Owner")}</div>
        <div>📞 ${esc(x.phone||"Not provided")}</div>
        <div class="contact-actions">
          <a class="btn call" href="tel:${phone}">Call</a>
          <a class="btn whatsapp" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>
      <button class="btn gold" style="width:100%;margin-top:10px" onclick="openInterest(${x.id})">I’m Interested</button>
    </div>`;

  show("details");
}

const photoInput=document.getElementById("photo");

photoInput.addEventListener("change",()=>{
  const f=photoInput.files[0];
  const p=document.getElementById("preview");
  if(!f){p.style.display="none";return}
  const r=new FileReader();
  r.onload=()=>{p.src=r.result;p.style.display="block"};
  r.readAsDataURL(f);
});

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!currentOwner){show("auth");return;}

  const form=e.target;
  const f=new FormData(form);
  const file=photoInput.files[0];
  const msg=document.getElementById("msg");
  const button=form.querySelector("button[type=submit]");

  button.disabled=true;
  button.textContent="Uploading photo...";
  msg.textContent="";

  try{
    const photo=await uploadPropertyPhoto(file);
    const phone=String(f.get("phone")||"").trim();
    const whatsapp=String(f.get("whatsapp")||phone).trim();

    homes.unshift({
      id:Date.now(),
      owner_id:currentOwner?.id||null,
      ownerName:String(f.get("ownerName")||"").trim(),
      phone,
      whatsapp,
      title:String(f.get("title")||"").trim(),
      location:String(f.get("location")||"").trim(),
      rent:Number(f.get("rent")),
      beds:Number(f.get("beds")),
      baths:Number(f.get("baths")),
      photo,
      description:String(f.get("description")||"").trim()
    });

    try{localStorage.setItem("astylesRentals003",JSON.stringify(homes))}catch(_){}

    form.reset();
    document.getElementById("preview").style.display="none";
    msg.textContent=file
      ?"Property published and photo uploaded successfully."
      :"Property published successfully.";

    render();
  }catch(error){
    console.error(error);
    msg.textContent="Photo upload failed: "+(error.message||"Please check Supabase Storage policies.");
  }finally{
    button.disabled=false;
    button.textContent="Publish Property";
  }
});


let selectedProperty = null;

function openInterest(id){
  selectedProperty = homes.find(v=>v.id===id);
  if(!selectedProperty) return;
  document.getElementById("interestProperty").innerHTML=`
    <div class="eyebrow">PROPERTY</div>
    <h3>${esc(selectedProperty.title)}</h3>
    <div class="price">${money(selectedProperty.rent)}/month</div>
    <div class="meta">${esc(selectedProperty.location)} · ${selectedProperty.beds} bedrooms · ${selectedProperty.baths} bathrooms</div>
    <div class="ownerbox"><strong>Owner</strong><div>👤 ${esc(selectedProperty.ownerName||"Property Owner")}</div><div>📞 ${esc(selectedProperty.phone||"Not provided")}</div></div>`;
  document.getElementById("interestMsg").textContent="";
  show("interest");
}

document.getElementById("interestForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!selectedProperty)return;
  const button=e.target.querySelector("button[type=submit]");
  const msg=document.getElementById("interestMsg");
  button.disabled=true; button.textContent="Sending..."; msg.textContent="";
  try{
    const tenantName=document.getElementById("tenantName").value.trim();
    const tenantPhone=document.getElementById("tenantPhone").value.trim();
    const tenantWhatsApp=tenantPhone;
    const message=document.getElementById("tenantMessage").value.trim();
    const {error}=await db.from("property_inquiries").insert({
      property_id:String(selectedProperty.id),
      owner_id:selectedProperty.owner_id||null,
      owner_name:selectedProperty.ownerName||"Property Owner",
      owner_phone:selectedProperty.phone||"",
      tenant_name:tenantName,
      tenant_phone:tenantPhone,
      tenant_whatsapp:tenantWhatsApp,
      message
    });
    if(error)throw error;
    msg.textContent="Inquiry sent successfully. The owner can now follow up with you.";
    e.target.reset();
  }catch(error){
    console.error(error);
    msg.textContent="Could not send inquiry: "+(error.message||"Please try again.");
  }finally{
    button.disabled=false; button.textContent="Send Inquiry";
  }
});


let authMode="login";
let currentOwner=null;

function openOwnerArea(){
  if(currentOwner){renderOwnerDashboard();show("dashboard");}
  else show("auth");
}

function setAuthMode(mode){
  authMode=mode;
  document.getElementById("loginTab").classList.toggle("active",mode==="login");
  document.getElementById("signupTab").classList.toggle("active",mode==="signup");
  document.getElementById("authSubmit").textContent=mode==="login"?"Login":"Create Account";
  document.getElementById("authNameField").style.display=mode==="signup"?"block":"none";
  document.getElementById("authMsg").textContent="";
}

async function handleOwnerAuth(e){
  e.preventDefault();
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  const name=document.getElementById("authName").value.trim();
  const msg=document.getElementById("authMsg");
  const button=document.getElementById("authSubmit");
  button.disabled=true;
  button.textContent=authMode==="login"?"Logging in...":"Creating account...";
  msg.textContent="";
  try{
    let result;
    if(authMode==="signup"){
      result=await db.auth.signUp({
        email,password,
        options:{data:{full_name:name}}
      });
    }else{
      result=await db.auth.signInWithPassword({email,password});
    }
    if(result.error)throw result.error;

    currentOwner=result.data.user;
    msg.textContent=authMode==="signup"
      ?"Account created. You can now use your Owner Page."
      :"Welcome back.";
    await renderOwnerDashboard();
    setTimeout(()=>show("dashboard"),300);
  }catch(error){
    console.error(error);
    msg.textContent=error.message||"Authentication failed.";
  }finally{
    button.disabled=false;
    button.textContent=authMode==="login"?"Login":"Create Account";
  }
}

document.getElementById("authForm").addEventListener("submit",handleOwnerAuth);

async function logoutOwner(){
  await db.auth.signOut();
  currentOwner=null;
  show("welcome");
}

async function restoreOwnerSession(){
  const {data}=await db.auth.getSession();
  if(data.session) currentOwner=data.session.user;
}

async function renderOwnerDashboard(){
  if(!currentOwner)return;

  document.getElementById("dashTitle").textContent=
    currentOwner.user_metadata?.full_name
      ? "Hi, "+currentOwner.user_metadata.full_name
      : "My Properties";

  const myHomes=homes.filter(x=>x.owner_id===currentOwner.id);
  document.getElementById("propertyCount").textContent=myHomes.length;

  const {data: inquiries,error}=await db.from("property_inquiries")
    .select("*")
    .eq("owner_id",currentOwner.id)
    .order("created_at",{ascending:false});

  const inquiryList=error?[]:(inquiries||[]);
  document.getElementById("inquiryCount").textContent=inquiryList.length;

  document.getElementById("ownerProperties").innerHTML=myHomes.length
    ? myHomes.map(x=>`
      <article class="card property">
        <img src="${x.photo||fallback}" alt="${esc(x.title)}">
        <div class="body">
          <div class="price">${money(x.rent)}/month</div>
          <h3>${esc(x.title)}</h3>
          <div class="meta">${esc(x.location)} · ${x.beds} bedrooms · ${x.baths} bathrooms</div>
        </div>
      </article>`).join("")
    : `<div class="card empty"><h3>No properties yet</h3><p>Tap “List a Property” to add your first house.</p></div>`;

  document.getElementById("ownerInquiries").innerHTML=inquiryList.length
    ? inquiryList.map(i=>`
      <div class="card" style="margin-top:10px">
        <strong>${esc(i.tenant_name)}</strong>
        <div class="meta">${esc(i.tenant_phone)} · ${esc(i.created_at ? new Date(i.created_at).toLocaleString() : "")}</div>
        <p>${esc(i.message||"No message provided.")}</p>
      </div>`).join("")
    : "<p>No enquiries yet.</p>";
}

/* Auth is restored automatically when the owner returns. */
restoreOwnerSession();

render();
</script>
</body>
</html>
