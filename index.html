<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081b3a">
<title>ASTYLES ONE Rentals</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#12213a}
header{height:64px;background:#081b3a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:900;letter-spacing:1.2px;font-size:19px}.topbtn{border:1px solid #e9bd3c;background:transparent;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}
main{max-width:900px;margin:auto;padding:18px 15px 92px}.screen{display:none}.screen.active{display:block}
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 0}
.eyebrow{color:#b88708;font-weight:900;letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(38px,10vw,62px);line-height:1.02;margin:12px 0}.hero p{color:#60708a;font-size:17px;max-width:520px}
.actions{width:min(420px,100%);display:grid;gap:12px;margin-top:18px}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:900;font-size:16px;cursor:pointer}.primary{background:#0b2a5b;color:#fff}.gold{background:#e9bd3c;color:#13213a}
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}.head h2{font-size:30px;margin:3px 0}.back{border:0;background:transparent;color:#0b2a5b;font-weight:900}
.filters{display:grid;grid-template-columns:1fr 170px;gap:9px;margin-bottom:15px}input,select,textarea{width:100%;padding:13px;border:1px solid #d4dce8;border-radius:11px;background:#fff;font:inherit}textarea{min-height:105px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:15px;box-shadow:0 5px 18px rgba(16,33,59,.07)}.property{padding:0;overflow:hidden}.property img{width:100%;height:175px;object-fit:cover;display:block}.property .body{padding:15px}.price{font-size:20px;font-weight:900;color:#0b2a5b}.meta{font-size:14px;color:#66758a;margin:7px 0 13px}
form{display:grid;gap:11px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.message{font-weight:800;color:#0b2a5b}.preview{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:7px;display:none}.detail-img{width:100%;max-height:360px;object-fit:cover;border-radius:16px}.empty{padding:25px;text-align:center}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dce3ec;display:flex;justify-content:center;gap:4px;padding:8px 6px;z-index:20}.bottom button{border:0;background:transparent;color:#0b2a5b;font-weight:900;padding:9px 10px}
@media(max-width:600px){.filters{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}.bottom button{font-size:12px}.hero{min-height:67vh}}
</style>
</head>
<body>
<header><div class="brand">ASTYLES ONE</div><button class="topbtn" onclick="show('owner')">List a House</button></header>
<main>
<section id="welcome" class="screen active">
<div class="hero"><div class="eyebrow">RENTALS</div><h1>Find Your Next Home</h1><p>One simple platform connecting house owners with tenants.</p>
<div class="actions"><button class="btn primary" onclick="show('tenant')">I'm a Tenant</button><button class="btn gold" onclick="show('owner')">I'm a House Owner</button></div></div>
</section>

<section id="tenant" class="screen">
<div class="head"><div><div class="eyebrow">TENANT</div><h2>Find a home</h2></div><button class="back" onclick="show('welcome')">Back</button></div>
<div class="filters"><input id="q" placeholder="Search location or property..." oninput="render()"><select id="max" onchange="render()"><option value="">Any rent</option><option value="1000000">Up to UGX 1M</option><option value="1500000">Up to UGX 1.5M</option><option value="2000000">Up to UGX 2M</option></select></div>
<div id="list" class="grid"></div>
</section>

<section id="details" class="screen"><button class="back" onclick="show('tenant')">Back to homes</button><div id="detail" style="margin-top:12px"></div></section>

<section id="owner" class="screen">
<div class="head"><div><div class="eyebrow">HOUSE OWNER</div><h2>List your property</h2></div><button class="back" onclick="show('welcome')">Back</button></div>
<div class="card"><form id="form">
<div class="field"><label>Property title</label><input name="title" required placeholder="e.g. 2 Bedroom House"></div>
<div class="field"><label>Location</label><input name="location" required placeholder="e.g. Ntinda, Kampala"></div>
<div class="field"><label>Monthly rent (UGX)</label><input name="rent" type="number" required placeholder="1200000"></div>
<div class="two"><div class="field"><label>Bedrooms</label><input name="beds" type="number" min="1" required value="2"></div><div class="field"><label>Bathrooms</label><input name="baths" type="number" min="1" required value="1"></div></div>
<div class="field"><label>Property photo</label><input id="photo" name="photo" type="file" accept="image/*"><img id="preview" class="preview" alt="Photo preview"></div>
<div class="field"><label>Description</label><textarea name="description" required placeholder="Tell tenants about the property..."></textarea></div>
<button class="btn primary" type="submit">Publish Property</button><div id="msg" class="message"></div>
</form></div>
</section>
</main>
<nav class="bottom"><button onclick="show('welcome')">Home</button><button onclick="show('tenant')">Find Homes</button><button onclick="show('owner')">List House</button></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ubcgltbyqohhgotwjhoy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViY2dsdGJ5cW9oaGdvdHdqaG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTU3MTcsImV4cCI6MjEwMjA3MTcxN30.MDtiNU5eSjbal31fdZwIqTPlwZlZEJzxFMDuArEuN_c";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STORAGE_BUCKET = "property-images";
const MAX_IMAGE_BYTES = 10 * 1024 * 1024;

async function uploadPropertyPhoto(file){
  if(!file) return fallback;
  if(!file.type.startsWith("image/")) throw new Error("Please select an image file.");
  if(file.size > MAX_IMAGE_BYTES) throw new Error("Photo is too large. Please use an image under 10 MB.");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`properties/${Date.now()}-${crypto.randomUUID()}.${ext||"jpg"}`;
  const { error } = await db.storage.from(STORAGE_BUCKET).upload(path,file,{
    cacheControl:"3600",
    upsert:false,
    contentType:file.type
  });
  if(error) throw error;
  const { data } = db.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

const fallback='https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=900&q=80';
const seed=[
{id:1,title:'Modern 2 Bedroom House',location:'Ntinda, Kampala',rent:1200000,beds:2,baths:2,photo:fallback,description:'Comfortable modern home in a convenient location.',phone:'+256 700 000 000'},
{id:2,title:'Family Home',location:'Kira, Wakiso',rent:1500000,beds:3,baths:2,photo:'https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=900&q=80',description:'Spacious family home with easy access to shops and transport.',phone:'+256 700 000 001'}
];
let homes; try{homes=JSON.parse(localStorage.getItem('astylesRentals002'))||seed}catch(e){homes=seed}
const money=n=>'UGX '+Number(n).toLocaleString('en-UG');
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='tenant')render();scrollTo(0,0)}
function render(){const q=(document.getElementById('q')?.value||'').toLowerCase();const max=Number(document.getElementById('max')?.value||0);const a=homes.filter(x=>(!q||x.location.toLowerCase().includes(q)||x.title.toLowerCase().includes(q))&&(!max||Number(x.rent)<=max));document.getElementById('list').innerHTML=a.length?a.map(x=>`<article class="card property"><img src="${x.photo||fallback}" alt="${x.title}"><div class="body"><div class="price">${money(x.rent)}/month</div><h3>${x.title}</h3><div class="meta">${x.location} · ${x.beds} bedrooms · ${x.baths} bathrooms</div><button class="btn primary" onclick="details(${x.id})">View Property</button></div></article>`).join(''):'<div class="card empty"><h3>No homes found</h3><p>Try another location or rent range.</p></div>'}
function details(id){const x=homes.find(v=>v.id===id);document.getElementById('detail').innerHTML=`<img class="detail-img" src="${x.photo||fallback}" alt="${x.title}"><div class="card" style="margin-top:12px"><div class="eyebrow">AVAILABLE HOME</div><h2>${x.title}</h2><div class="price">${money(x.rent)}/month</div><div class="meta">${x.location} · ${x.beds} bedrooms · ${x.baths} bathrooms</div><p>${x.description}</p><button class="btn primary" onclick="alert('Demo contact: ${x.phone||'+256 700 000 000'}')">Contact Owner</button></div>`;show('details')}
const photoInput=document.getElementById('photo');photoInput.addEventListener('change',()=>{const f=photoInput.files[0];const p=document.getElementById('preview');if(!f){p.style.display='none';return}const r=new FileReader();r.onload=()=>{p.src=r.result;p.style.display='block'};r.readAsDataURL(f)});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const form=e.target;const f=new FormData(form);const file=photoInput.files[0];const msg=document.getElementById('msg');const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Uploading photo...';msg.textContent='';try{const photo=await uploadPropertyPhoto(file);homes.unshift({id:Date.now(),title:f.get('title'),location:f.get('location'),rent:Number(f.get('rent')),beds:Number(f.get('beds')),baths:Number(f.get('baths')),photo,description:f.get('description'),phone:'+256 700 000 000'});try{localStorage.setItem('astylesRentals002',JSON.stringify(homes))}catch(storageError){}form.reset();document.getElementById('preview').style.display='none';msg.textContent=file?'Property published and photo uploaded successfully.':'Property published successfully.';render()}catch(error){console.error(error);msg.textContent='Photo upload failed: '+(error.message||'Please check Supabase Storage policies.')}finally{button.disabled=false;button.textContent='Publish Property'}});
render();
</script>
</body>
</html>
